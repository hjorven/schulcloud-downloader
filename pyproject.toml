[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schulcloud-downloader"
version = "0.1.0"
description = "Massendownload eigener Materialien aus der Schul-Cloud (dBildungscloud / Schul-Cloud Brandenburg)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sc-dl = "sc_dl.cli:main"

[tool.setuptools]
packages = ["sc_dl"]

[tool.setuptools.package-data]
sc_dl = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
